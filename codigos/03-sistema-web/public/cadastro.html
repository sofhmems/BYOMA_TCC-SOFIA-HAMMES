<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sustentabilidade Têxtil</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="split-layout">
    <div class="card-container">
        <div class="login-card">
            <div class="card-left">
                <img src="img/logo.png" alt="BYOMA" class="logo-simbolo">
            </div>
            <div class="card-right">
                <div class="logo-texto">
                    <h1>Criar Conta</h1>
                    <p>Cadastre-se para acessar o sistema</p>
                </div>

                <form id="form-cadastro">
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <input type="text" id="nome-completo" placeholder="Seu nome" required>
                    </div>
                    <div class="form-group">
                        <label>Usuário</label>
                        <input type="text" id="username" placeholder="Escolha um usuário" required>
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="password" placeholder="Crie uma senha" required>
                    </div>
                    <div class="form-group">
                        <label>Confirmar Senha</label>
                        <input type="password" id="confirmar-senha" placeholder="Repita a senha" required>
                    </div>

                    <div id="erro-cadastro" class="error-message"></div>
                    <div id="sucesso-cadastro" style="color: #4a7c6f; font-size: 13px; text-align: center; display: none; margin-bottom: 10px;">
                        Conta criada com sucesso! Redirecionando...
                    </div>

                    <div id="loading-cadastro" class="loading">
                        <div class="spinner"></div>
                        <p>Cadastrando...</p>
                    </div>

                    <button type="submit" class="btn" id="btn-cadastrar">Cadastrar</button>
                </form>

                <p style="text-align: center; margin-top: 15px;">
                    Já tem conta? <a href="login.html" class="link-cadastro">Faça login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/cadastro.js"></script>
</body>
</html>
