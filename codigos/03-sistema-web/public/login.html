<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Sustentabilidade Têxtil</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="split-layout">
    <div class="card-container">
        <div class="login-card">
            <div class="card-left">
                <img src="img/logo.png" alt="BYOMA" class="logo-simbolo">
            </div>
            <div class="card-right">
                <div class="logo-texto">
                    <h1>Sustentabilidade Têxtil</h1>
                    <p>Sistema de Análise Comparativa Automatizada</p>
                </div>

                <form id="form-login">
                    <div class="form-group">
                        <label>Usuário</label>
                        <input type="text" id="username" placeholder="Digite seu usuário" required autofocus>
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="password" placeholder="Digite sua senha" required>
                    </div>

                    <div id="erro-login" class="error-message"></div>

                    <div id="loading-login" class="loading">
                        <div class="spinner"></div>
                        <p>Autenticando...</p>
                    </div>

                    <button type="submit" class="btn" id="btn-entrar">Entrar</button>
                </form>

                <p style="text-align: center; margin-top: 15px;">
                    <a href="cadastro.html" class="link-cadastro">Cadastre-se</a>
                </p>

                <p style="text-align: center; color: #7a5a5a; font-size: 12px; margin-top: 20px;">
                    Integração com ESP32 · v1.0
                </p>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
