<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico - Sustentabilidade Têxtil</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a3a2a 0%, #4a7c6f 50%, #1a3a2a 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .logo-img {
            mix-blend-mode: multiply;
        }

        .tabela-historico {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 14px;
        }

        .tabela-historico th {
            background: #1a3a2a;
            color: #fff;
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
        }

        .tabela-historico td {
            padding: 10px 16px;
            border-bottom: 1px solid #f2d5d5;
            color: #333;
        }

        .tabela-historico tr:hover td {
            background: #f2d5d5;
        }

        .tabela-historico th:first-child {
            border-radius: 10px 0 0 0;
        }

        .tabela-historico th:last-child {
            border-radius: 0 10px 0 0;
        }

        .vazio-msg {
            text-align: center;
            padding: 40px;
            color: #7a5a5a;
            font-size: 15px;
        }

        .badge-sust {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
        }

        .badge-sust.alta { background: #b8d9c5; color: #1a3a2a; }
        .badge-sust.media { background: #f2d5d5; color: #7a5a5a; }
        .badge-sust.baixa { background: #e8c4c4; color: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <img src="img/logo.png" alt="Logo" class="logo-img">
                <h1>Histórico de Testes</h1>
                <p>Todas as análises realizadas</p>
            </div>

            <div class="user-info">
                Usuário: <span id="nome-usuario"></span>
                | <a href="#" id="btn-sair" style="color: #b88a8a; text-decoration: none;">Sair</a>
            </div>

            <div id="loading-hist" class="loading active">
                <div class="spinner"></div>
                <p>Carregando histórico...</p>
            </div>

            <div id="conteudo-historico" class="hidden">
                <div class="botoes-acao" style="margin-bottom: 10px;">
                    <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">Nova Análise</button>
                    <button class="btn" onclick="baixarCSV()">Baixar Planilha (CSV)</button>
                </div>

                <div id="tabela-container"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const res = await fetch('/api/sessao');
            const data = await res.json();

            if (!data.autenticado) {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('nome-usuario').textContent = data.nome;
            carregarHistorico();
        });

        document.getElementById('btn-sair').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = 'login.html';
        });

        async function carregarHistorico() {
            try {
                const res = await fetch('/api/historico');
                const testes = await res.json();

                const container = document.getElementById('tabela-container');

                if (testes.length === 0) {
                    container.innerHTML = '<div class="vazio-msg">Nenhum teste realizado ainda.<br>Faça uma análise para começar!</div>';
                } else {
                    let html = `<table class="tabela-historico">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Tipo de Tecido</th>
                                <th>Ciclos</th>
                                <th>Sustentabilidade</th>
                                <th>Desgaste</th>
                                <th>Partículas</th>
                                <th>Duração</th>
                            </tr>
                        </thead>
                        <tbody>`;

                    const nomes = { 'sintetico': '🧪 Sintético', 'natural': '🌿 Natural', 'misto': '🔄 Misto' };

                    testes.forEach(t => {
                        let classe = 'alta';
                        if (t.sustentabilidade < 35) classe = 'baixa';
                        else if (t.sustentabilidade < 60) classe = 'media';

                        html += `<tr>
                            <td>${t.data}</td>
                            <td>${nomes[t.tipo] || t.tipo_nome}</td>
                            <td>${t.ciclos}</td>
                            <td><span class="badge-sust ${classe}">${t.sustentabilidade}%</span></td>
                            <td>${t.desgaste}%</td>
                            <td>${t.particulas} ppm</td>
                            <td>${t.anos_estimados} anos</td>
                        </tr>`;
                    });

                    html += '</tbody></table>';
                    container.innerHTML = html;
                }

                document.getElementById('loading-hist').classList.remove('active');
                document.getElementById('conteudo-historico').classList.remove('hidden');
            } catch (err) {
                document.getElementById('loading-hist').innerHTML = '<p style="color:#c0392b;">Erro ao carregar histórico</p>';
            }
        }

        async function baixarCSV() {
            try {
                const res = await fetch('/api/historico/csv');
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'historico_testes.csv';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            } catch (err) {
                alert('Erro ao baixar planilha');
            }
        }
    </script>
</body>
</html>
